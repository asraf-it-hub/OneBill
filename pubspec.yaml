name: onebill
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+8000

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0
  intl: ^0.20.2
  supabase_flutter: ^2.17.2
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.6
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  credential_manager: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/OneBillLogo.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansTelugu-Regular.ttf
    - assets/fonts/NotoSansTelugu-Bold.ttf
